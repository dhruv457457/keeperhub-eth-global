[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "keeperhub-langchain"
version = "0.3.2"
description = "LangChain toolkit for KeeperHub — reliable onchain execution, DeFi protocol actions, and AI workflow generation for any LangChain agent"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "KeeperHub" }]
requires-python = ">=3.10"
keywords = ["langchain", "keeperhub", "web3", "defi", "blockchain", "agents", "x402"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "httpx>=0.27.0",
    "langchain-core>=0.2.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
workflows = [
    "langchain-mcp-adapters>=0.1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "langchain-openai>=0.1.0",
    "python-dotenv>=1.0",
]

[project.urls]
Repository = "https://github.com/KeeperHub/keeperhub-eth-global"
Documentation = "https://docs.keeperhub.com"

[tool.setuptools.packages.find]
where = ["."]
include = ["langchain_keeperhub*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
